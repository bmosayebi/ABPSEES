[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abpsees"
version = "0.1.0"
description = "Aspect-Based Preference Scoring + Evidence Extraction with Qwen2.5-3B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.28",
    "datasets>=2.18",
    "evaluate>=0.4",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tensorboard>=2.14",
    "jupyter>=1.0",
    "scipy>=1.12",
    "bitsandbytes>=0.43",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
